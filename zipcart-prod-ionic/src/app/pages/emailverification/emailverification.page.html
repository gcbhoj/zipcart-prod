<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Email-Verification</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="main-container">
    <div class="top-container-logo">
      <img src="assets/ZipCartLogo.jpg" alt="zipcart logo" />
    </div>
    <div class="top-container-text">
      <h3>Email Verification</h3>
    </div>
    <div class="main-content">
      <h3>check you email</h3>

      <p>we sent a verification link to your email address</p>

      <p>
        Please open the email and click the verification link to activate your
        account
      </p>
    </div>
    <div class="button-container">
      <div>
        <h5>
          Did not receive an email ?<strong
            ><a type="button" (click)="resendEmailVerification()" class="button-text"
              >Resend Email</a
            ></strong
          >
        </h5>
      </div>
      <div>
        <h5>
          Already Have an account ?
          <strong
            ><a type="button" (click)="navigateToLogin()">log in</a></strong
          >
        </h5>
      </div>
    </div>
  </div>
</ion-content>
